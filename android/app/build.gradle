plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.akshay.happylocal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.akshay.happylocal'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.0.1'

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.13"
        pip {
            install "telethon==1.45.0"
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}
